appId: app.hearthremote.client
productName: Hearth Remote
directories:
  output: dist
files:
  - out/**/*
asar: true
icon: build/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Hearth Remote
